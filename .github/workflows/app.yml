name: app
# Frontend (paciente + clínica): contrato com a API, typecheck, testes e build. Roda em PRs e na main quando app/ ou o contrato mudam.
on:
  push:
    branches: [main]
    paths: ["app/**", "backend/app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "backend/app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tipos do app em dia com a API (OpenAPI é a fonte da verdade)
        run: |
          npm run gen:api
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
