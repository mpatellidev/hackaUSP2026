[project]
name = "uhealth-backend"
version = "0.1.0"
description = "API do UHealth (protótipo de hackathon, dados fictícios, autenticação DEMO)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  # chat (#9): IA opcional (LLM_PROVIDER=mock é o padrão) e TTS opcional
  "google-genai>=3.0",
  "anthropic>=2.6",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
pythonpath = ["."]

[tool.uv]
package = false
