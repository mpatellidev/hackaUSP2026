function mountUHealth(root,opts={}){

 function serviceForm(s){modal(s?'Gerenciar serviço':'Adicionar serviço',`<div class="form-grid"><label class="field full">Nome do serviço<input name="name" required value="${esc(s?.name||'')}"></label><label class="field">Tipo<select name="type">${['Consulta','Exame','Tratamento'].map(t=>`<option ${s?.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Vagas disponíveis<input name="capacity" type="number" min="0" max="999" value="${s?.capacity||0}" required></label><label class="field full">Descrição<textarea name="desc" required>${esc(s?.desc||'')}</textarea></label><label class="field full">Perfil de paciente atendido<textarea name="profile" required>${esc(s?.profile||'')}</textarea></label><label class="field full">Critérios para atendimento<textarea name="criteria" required>${esc(s?.criteria||'')}</textarea></label></div><label class="checkbox"><input type="checkbox" name="active" ${!s||s.active?'checked':''}>Serviço ativo para novas solicitações</label><input type="hidden" name="id" value="${s?.id||''}"><div class="modal-actions"><button type="button" class="button" data-action="close">Cancelar</button><button class="button primary">Salvar serviço</button></div>`,'service')}
 root.addEventListener('click',e=>{if(opts.review&&e.target.closest('[contenteditable]'))return;const page=e.target.closest('[data-page]');if(page){e.preventDefault();state.page=page.dataset.page;render();return}const patient=e.target.closest('[data-patient]');if(patient){state.selected=Number(patient.dataset.patient);render();if(state.page!=='triagem'&&(window.innerWidth<=1200||opts.review))openProfile();return}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}const st=e.target.closest('[data-service-tab]');if(st){state.serviceTab=st.dataset.serviceTab;render();return}const service=e.target.closest('[data-service]');if(service){serviceForm(services.find(s=>s.id===Number(service.dataset.service)));return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 if(action==='menu')$('.shell').classList.toggle('menu-open');if(action==='close')$('dialog').close();if(action==='theme'){if(!opts.review){state.theme=!state.theme;document.documentElement.className=state.theme?'theme-dark':'theme-light'}else toast('Compare os temas nos dois painéis da revisão.')}
 if(action==='profile')openProfile();if(action==='triage'){const p=selected();if(['Agendada','Encerrada'].includes(p.status))return;if(p.status!=='Em triagem'){p.status='Em triagem';p.stage='Encaminhado à triagem'}state.page='triagem';render()}
 if(action==='new-service')serviceForm();if(action==='publish'){const available=ownServices().filter(s=>s.active);if(!available.length){toast('Ative ou adicione um serviço para publicar vagas.');return}modal('Publicar vaga',`<p class="muted" style="margin-top:12px;font-size:13px">Amplie a disponibilidade de atendimento da sua clínica.</p><div class="form-grid"><label class="field full">Serviço<select name="service">${available.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label class="field full">Quantidade de novas vagas<input name="capacity" type="number" min="1" max="999" required value="1"></label></div><div class="modal-actions"><button type="button" class="button" data-action="close">Cancelar</button><button class="button primary">Publicar vagas</button></div>`,'publish')}
 if(action==='export'){const csv='\uFEFFPaciente;Serviço;Espera (dias);Situação\r\n'+filtered().map(p=>[p.name,p.service,p.days,p.status].map(s=>'"'+String(s).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='uhealth-solicitacoes-'+state.clinic+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Solicitações exportadas em CSV.')}
 });
 function openProfile(){const p=selected();modal('Perfil do paciente',`${profile(p,true)}<h3 style="margin-top:24px">Histórico da solicitação</h3><ol class="timeline"><li><time datetime="2026-11-07">${p.date}</time>Solicitação recebida pela clínica</li><li><time datetime="2026-11-07">Situação atual</time>${esc(p.stage)}</li></ol><p class="muted" style="font-size:12px">Contato fictício: ${p.phone}<br>${p.city}</p>`);const nested=$('dialog [data-action="profile"]');nested?.remove()}
 root.addEventListener('input',e=>{if(e.target.matches('[data-query]')){state.query=e.target.value;syncResults()}});
 root.addEventListener('change',e=>{if(e.target.matches('[data-clinic]')){state.clinic=e.target.value;state.selected=rows()[0].id;state.tab='Todas';state.query='';state.category='Todos os serviços';render()}if(e.target.matches('[data-category]')){state.category=e.target.value;syncResults()}if(e.target.name==='result'){const scheduled=e.target.value==='Avaliação agendada';for(const name of ['date','time']){const input=$(`[name="${name}"]`);input.required=scheduled;input.disabled=!scheduled}}});
 root.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const f=new FormData(form);const kind=form.dataset.form;
 if(kind==='settings'){Object.assign(clinics[state.clinic],{name:f.get('name'),address:f.get('address'),phone:f.get('phone'),email:f.get('email'),open:f.has('open')});render();toast('Configurações atualizadas nesta demonstração.')}
 if(kind==='publish'){const s=ownServices().find(s=>s.id===Number(f.get('service')));s.capacity+=Number(f.get('capacity'));render();toast('Vagas publicadas nesta demonstração.')}
 if(kind==='service'){const id=Number(f.get('id'));const data={name:f.get('name'),type:f.get('type'),capacity:Number(f.get('capacity')),desc:f.get('desc'),profile:f.get('profile'),criteria:f.get('criteria'),active:f.has('active')};if(id)Object.assign(ownServices().find(s=>s.id===id),data);else services.push({...data,id:Math.max(...services.map(s=>s.id))+1,ico:'file',clinic:state.clinic});render();toast('Serviço salvo nesta demonstração.')}
 if(kind==='triage'){const p=selected();const result=f.get('result');p.status=result==='Avaliação agendada'?'Agendada':result==='Precisamos de contato'?'Em análise':'Encerrada';p.note=String(f.get('note')||'').trim();p.stage=result==='Avaliação agendada'?`Avaliação agendada para ${f.get('date').split('-').reverse().join('/')} às ${f.get('time')}`:result;state.tab='Todas';state.query='';state.category='Todos os serviços';state.page='solicitacoes';render();toast('Triagem registrada. Nenhuma mensagem foi enviada.')}
 });render();return {render,state};
}
if(document.getElementById('app'))mountUHealth(document.getElementById('app'));
</script></body></html>
